<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Battle</title>
<style>
:root {
  --bg: #f2f3f7; --panel: #ffffff; --fg: #171a22; --muted: #5d6475; --line: #d9dce5;
  --accent: #2a55e5; --accent-fg: #ffffff; --stage: #dfe3ec; --ok: #14804a; --warn: #b35c00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161c; --panel: #1c1f27; --fg: #e8e9ee; --muted: #9aa0ae; --line: #2c303b;
          --accent: #7aa2ff; --accent-fg: #0d1220; --stage: #0e1014; --ok: #5fd39a; --warn: #ffb454;
          color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
       padding: 12px max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left)); }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; max-width: 1100px; margin: 0 auto 10px; }
h1 { margin: 0; font-size: 20px; }
h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#conn { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; max-width: 1100px; margin: 0 auto; align-items: start; }
.board { background: var(--stage); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
canvas { display: block; width: 100%; max-width: 760px; margin: 0 auto; aspect-ratio: 1; image-rendering: pixelated; touch-action: none; cursor: crosshair; background: #fff; }
aside { display: grid; gap: 12px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; min-height: 38px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
#hint { margin: 8px 0 0; color: var(--muted); min-height: 2.8em; }
#pal { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
#pal button { padding: 0; aspect-ratio: 1; min-height: 0; border-radius: 4px; }
#pal button.team { border: 3px solid var(--fg); }
#pal button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.legend { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--ok); }
.fill.wait { background: var(--warn); }
#cdtxt { margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.team-row { display: grid; grid-template-columns: 16px 64px 1fr 56px; gap: 8px; align-items: center; margin-bottom: 6px; }
.team-row .sw { width: 16px; height: 16px; border-radius: 3px; }
.team-row .num { text-align: right; font-variant-numeric: tabular-nums; }
.team-row .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.team-row .bar i { display: block; height: 100%; width: 0; }
#rstat { margin: 8px 0 0; color: var(--muted); min-height: 1.4em; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .board { position: sticky; top: 0; z-index: 2; }   /* canvas stays visible while the controls scroll */
  canvas { max-width: min(100%, 46vh); }
}
</style>
</head>
<body>
<header>
  <h1>Pixel Battle</h1>
  <span id="conn">Connecting…</span>
</header>
<main>
  <section class="board"><canvas id="cv" width="128" height="128" aria-label="Shared 128 by 128 canvas"></canvas></section>
  <aside>
    <section class="card">
      <h2>Tools</h2>
      <div class="row" id="tools">
        <button data-tool="pen" aria-pressed="true">Pixel pen</button>
        <button data-tool="line" aria-pressed="false">Line</button>
        <button data-tool="circle" aria-pressed="false">Circle</button>
        <button data-tool="polygon" aria-pressed="false">Polygon</button>
        <button data-tool="bucket" aria-pressed="false">Paint bucket</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="finish" hidden>Finish polygon</button>
        <button id="cancel" hidden>Cancel shape</button>
      </div>
      <p id="hint"></p>
    </section>
    <section class="card">
      <h2>Palette (HSB)</h2>
      <div id="pal"></div>
      <dl id="colinfo"></dl>
      <p class="legend">Thick border = team colour.</p>
    </section>
    <section class="card">
      <h2>Cooldown</h2>
      <div class="track"><div class="fill" id="cdbar"></div></div>
      <p id="cdtxt">Ready</p>
    </section>
    <section class="card">
      <h2>Team scoreboard</h2>
      <div id="score"></div>
    </section>
    <section class="card">
      <h2>Replay</h2>
      <button id="replay">Replay whole battle</button>
      <p id="rstat"></p>
    </section>
  </aside>
</main>

<script>
/* ---------------- constants and the HSB palette ---------------- */
const W = 128, H = 128;
// [name, hue (deg), saturation (%), brightness (%)]
const PAL = [
  ['White', 0, 0, 100], ['Light grey', 0, 0, 75], ['Dark grey', 0, 0, 40], ['Black', 0, 0, 8],
  ['Red', 0, 85, 90], ['Blue', 220, 85, 90], ['Green', 130, 75, 70], ['Yellow', 52, 90, 100],
  ['Orange', 28, 90, 100], ['Brown', 25, 65, 45], ['Lime', 85, 80, 85], ['Cyan', 185, 80, 85],
  ['Sky', 205, 55, 100], ['Purple', 275, 70, 75], ['Pink', 325, 55, 100], ['Maroon', 350, 85, 55]
];
const TEAMS = [4, 5, 6, 7];            // Red, Blue, Green, Yellow

function hsb2rgb(h, s, b) {            // HSB (HSV) to RGB, 0-255
  s /= 100; b /= 100;
  const k = n => (n + h / 60) % 6;
  const f = n => b * (1 - s * Math.max(0, Math.min(k(n), 4 - k(n), 1)));
  return [Math.round(255 * f(5)), Math.round(255 * f(3)), Math.round(255 * f(1))];
}
const RGB = PAL.map(p => hsb2rgb(p[1], p[2], p[3]));
RGB.push([255, 0, 255]);               // index 16: marker for pending shape points (never sent)
const HEX = RGB.map(r => '#' + r.map(v => v.toString(16).padStart(2, '0')).join(''));

/* ---------------- framebuffer and setPixel (the only drawing call) ---------------- */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const fb = ctx.createImageData(W, H);
const live = new Uint8Array(W * H);    // current shared canvas as palette indexes
let dirty = true;

function setPixel(x, y, c) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const o = (y * W + x) * 4, rgb = RGB[c];
  fb.data[o] = rgb[0]; fb.data[o + 1] = rgb[1]; fb.data[o + 2] = rgb[2]; fb.data[o + 3] = 255;
  dirty = true;
}
function drawAll(arr) { for (let i = 0; i < W * H; i++) setPixel(i % W, (i / W) | 0, arr[i]); }
(function loop() { if (dirty) { ctx.putImageData(fb, 0, 0); dirty = false; } requestAnimationFrame(loop); })();
drawAll(live);

/* ---------------- my own rasterization algorithms ---------------- */
function bresenham(x0, y0, x1, y1) {
  const pts = [], dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    pts.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
  return pts;
}

function midpointCircle(cx, cy, r) {
  const pts = [];
  let x = 0, y = r, d = 1 - r;
  while (x <= y) {
    pts.push([cx + x, cy + y], [cx - x, cy + y], [cx + x, cy - y], [cx - x, cy - y],
             [cx + y, cy + x], [cx - y, cy + x], [cx + y, cy - x], [cx - y, cy - x]);
    if (d < 0) d += 2 * x + 3; else { d += 2 * (x - y) + 5; y--; }
    x++;
  }
  return pts;
}

function scanlineFill(v) {             // v = polygon corners [[x, y], ...]
  const ys = v.map(p => p[1]), ymin = Math.min(...ys), ymax = Math.max(...ys), out = [];
  for (let y = ymin; y <= ymax; y++) {
    const xs = [];
    for (let i = 0; i < v.length; i++) {
      const a = v[i], b = v[(i + 1) % v.length];
      if (a[1] === b[1]) continue;     // horizontal edges add no crossing
      const lo = Math.min(a[1], b[1]), hi = Math.max(a[1], b[1]);
      if (y >= lo && (y < hi || (y === hi && hi === ymax))) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      for (let x = Math.ceil(xs[i] - 1e-9); x <= Math.floor(xs[i + 1] + 1e-9); x++) out.push([x, y]);
    }
  }
  return out;
}

function floodFill(x, y, c) {          // queue-based, 4-connected, uses the current canvas
  const start = y * W + x, target = live[start];
  if (target === c) return [];
  const seen = new Uint8Array(W * H), queue = [start], out = [];
  seen[start] = 1;
  for (let head = 0; head < queue.length; head++) {
    const i = queue[head], cx = i % W, cy = (i / W) | 0;
    out.push(i);
    const next = [];
    if (cx > 0) next.push(i - 1);
    if (cx < W - 1) next.push(i + 1);
    if (cy > 0) next.push(i - W);
    if (cy < H - 1) next.push(i + W);
    for (const n of next) if (!seen[n] && live[n] === target) { seen[n] = 1; queue.push(n); }
  }
  return out;
}

function toIndexes(points) {           // cells -> unique in-bounds indexes
  const set = new Set();
  for (const p of points) if (p[0] >= 0 && p[1] >= 0 && p[0] < W && p[1] < H) set.add(p[1] * W + p[0]);
  return Array.from(set);
}

/* ---------------- state and UI ---------------- */
const $ = id => document.getElementById(id);
let color = 4, tool = 'pen', pts = [], marks = [];
let replaying = false, pending = false, nextAt = 0, cooldownMs = 5000, ws = null;

const HINTS = {
  pen: 'Tap a cell to place one pixel.',
  line: 'Tap the start point, then the end point.',
  circle: 'Tap the centre, then a point on the circle.',
  polygon: 'Tap each corner, then press Finish polygon.',
  bucket: 'Tap a cell to fill the connected area.'
};
function hint(extra) { $('hint').textContent = (extra ? extra + ' ' : '') + HINTS[tool]; }

function setMarks(list) {              // show pending shape points in magenta
  for (const i of marks) setPixel(i % W, (i / W) | 0, live[i]);
  marks = list;
  for (const i of marks) setPixel(i % W, (i / W) | 0, 16);
}
function clearPts() { pts = []; setMarks([]); updateButtons(); }
function updateButtons() {
  $('finish').hidden = tool !== 'polygon';
  $('finish').disabled = pts.length < 3;
  $('cancel').hidden = pts.length === 0;
}

document.querySelectorAll('#tools button').forEach(b => {
  b.onclick = () => {
    tool = b.dataset.tool; clearPts();
    document.querySelectorAll('#tools button').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
    hint();
  };
});
$('cancel').onclick = () => { clearPts(); hint(); };
$('finish').onclick = () => {
  if (pts.length < 3) return;
  submit(toIndexes(scanlineFill(pts)));
};

/* palette: swatches plus the H, S, B, RGB and HEX of the selected colour */
function buildPalette() {
  const pal = $('pal');
  PAL.forEach((p, i) => {
    const b = document.createElement('button');
    b.style.background = HEX[i];
    b.title = p[0] + ': H ' + p[1] + ' S ' + p[2] + ' B ' + p[3] + ' ' + HEX[i];
    b.setAttribute('aria-label', p[0]);
    if (TEAMS.includes(i)) b.classList.add('team');
    b.onclick = () => selectColor(i);
    pal.appendChild(b);
  });
  selectColor(color);
}
function selectColor(i) {
  color = i;
  Array.from($('pal').children).forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  const p = PAL[i], r = RGB[i];
  $('colinfo').innerHTML =
    '<dt>Colour</dt><dd>' + p[0] + (TEAMS.includes(i) ? ' (team)' : '') + '</dd>' +
    '<dt>H / S / B</dt><dd>' + p[1] + '° / ' + p[2] + '% / ' + p[3] + '%</dd>' +
    '<dt>RGB</dt><dd>' + r.join(', ') + '</dd>' +
    '<dt>HEX</dt><dd>' + HEX[i] + '</dd>';
}

/* scoreboard */
function buildScoreboard() {
  $('score').innerHTML = TEAMS.map((c, k) =>
    '<div class="team-row"><span class="sw" style="background:' + HEX[c] + '"></span><span>' + PAL[c][0] +
    '</span><span class="bar"><i id="bar' + k + '" style="background:' + HEX[c] + '"></i></span><span class="num" id="num' + k + '">0</span></div>').join('');
}
function showScores(sc) {
  const max = Math.max(1, ...sc);
  sc.forEach((n, k) => { $('num' + k).textContent = n; $('bar' + k).style.width = (n / max * 100) + '%'; });
}

/* cooldown display */
setInterval(() => {
  const left = nextAt - Date.now();
  if (left <= 0) { $('cdbar').style.width = '100%'; $('cdbar').className = 'fill'; $('cdtxt').textContent = 'Ready'; }
  else { $('cdbar').style.width = (100 - left / cooldownMs * 100) + '%'; $('cdbar').className = 'fill wait'; $('cdtxt').textContent = 'Next action in ' + (left / 1000).toFixed(1) + ' s'; }
}, 100);

/* ---------------- input (touch and mouse through pointer events) ---------------- */
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (replaying) return;
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  onCell(x, y);
});

function onCell(x, y) {
  if (tool === 'pen') return submit([y * W + x]);
  if (tool === 'bucket') return submit(floodFill(x, y, color));
  pts.push([x, y]);
  setMarks(toIndexes(pts));
  updateButtons();
  if (tool === 'line' && pts.length === 2) {
    submit(toIndexes(bresenham(pts[0][0], pts[0][1], pts[1][0], pts[1][1])));
  } else if (tool === 'circle' && pts.length === 2) {
    const r = Math.round(Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]));
    submit(toIndexes(midpointCircle(pts[0][0], pts[0][1], r)));
  } else if (tool === 'polygon') {
    hint(pts.length + ' corner' + (pts.length === 1 ? '' : 's') + '.');
  } else {
    hint('Point ' + pts.length + ' set.');
  }
}

function submit(px) {
  if (!px.length) { hint('Nothing to change there.'); clearPts(); return; }
  const left = nextAt - Date.now();
  if (left > 0) { hint('Wait ' + (left / 1000).toFixed(1) + ' s for the cooldown.'); return; }
  if (pending || !ws || ws.readyState !== 1) { hint('Not connected yet.'); return; }
  pending = true;
  ws.send(JSON.stringify({ t: 'draw', c: color, px }));
  clearPts();
  hint();
}

/* ---------------- networking ---------------- */
let pid = '';
try { pid = localStorage.getItem('pbid') || ''; } catch (_) {}
if (!pid) {
  pid = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { localStorage.setItem('pbid', pid); } catch (_) {}
}

function applyDraw(c, px) {
  for (const i of px) {
    live[i] = c;
    if (!replaying) setPixel(i % W, (i / W) | 0, c);
  }
  if (!replaying && marks.length) setMarks(marks);
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => { $('conn').textContent = 'Connected'; ws.send(JSON.stringify({ t: 'hello', id: pid })); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'init') {
      const bin = atob(m.canvas);
      for (let i = 0; i < bin.length; i++) live[i] = bin.charCodeAt(i);
      cooldownMs = m.cooldown;
      showScores(m.scores);
      if (!replaying) { drawAll(live); setMarks(marks); }
    } else if (m.t === 'draw') {
      applyDraw(m.c, m.px);
      showScores(m.scores);
    } else if (m.t === 'ok') {
      pending = false; cooldownMs = m.cooldown; nextAt = Date.now() + m.cooldown;
    } else if (m.t === 'wait') {
      pending = false; nextAt = Date.now() + m.ms;
    }
  };
  ws.onclose = () => { $('conn').textContent = 'Disconnected. Reconnecting…'; pending = false; setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
}

/* ---------------- time-lapse replay from the stored action log ---------------- */
$('replay').onclick = async () => {
  if (replaying) return;
  let log;
  try { log = await (await fetch('/log')).json(); } catch (_) { $('rstat').textContent = 'Could not load the action log.'; return; }
  if (!log.length) { $('rstat').textContent = 'No actions yet.'; return; }
  replaying = true; $('replay').disabled = true; clearPts();
  for (let i = 0; i < W * H; i++) setPixel(i % W, (i / W) | 0, 0);
  const first = log[0].ts, total = log[log.length - 1].ts - first;
  const length = Math.max(1, Math.min(total, 20000));      // whole battle plays in at most 20 s
  const speed = total / length || 1;
  const start = performance.now();
  let n = 0;
  (function step(now) {
    const t = (now - start) * speed;
    while (n < log.length && log[n].ts - first <= t) {
      for (const i of log[n].px) setPixel(i % W, (i / W) | 0, log[n].c);
      n++;
    }
    $('rstat').textContent = 'Replaying: ' + n + ' of ' + log.length + ' actions';
    if (n < log.length) requestAnimationFrame(step);
    else setTimeout(() => {
      replaying = false; $('replay').disabled = false;
      drawAll(live); $('rstat').textContent = 'Replay finished. Back to the live canvas.';
    }, 1500);
  })(start);
};

buildPalette();
buildScoreboard();
hint();
connect();
</script>
</body>
</html>
